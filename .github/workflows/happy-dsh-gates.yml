# happy-dsh — this fork's own gates, on GitHub-hosted runners.
#
# Upstream's ci.yml and ci-master.yml pin every job to DeepSeek's private runner
# fleet: Blacksmith labels, `[self-hosted, linux, x64, vm-backup]`,
# `[self-hosted, dsh-win-ci, windows]`, and the fallback label
# `dsh-ubuntu-24-04-16core`. Their `vars.DSH_CI_FAILOVER_*` chain reads like a
# choice, but all three of its outcomes are upstream-only labels, so no variable
# value reaches a GitHub-hosted runner. A fork inherits the labels without the
# fleet and nothing there can run.
#
# This file runs the same gate families on a standard runner instead. It
# deliberately does not edit either upstream file, so syncing upstream never
# conflicts with it — add, drop, or reorder jobs here freely.
#
# The fork is public, so standard GitHub-hosted runners are not billed.

name: happy-dsh gates

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DSH_TELEMETRY_DISABLED: '1'
  # Stop the aggregate at the first blocking gate failure instead of burning the
  # rest of the budget on gates whose verdict no longer matters.
  DSH_GATE_FAIL_FAST: '1'

jobs:

  static:
    name: static gates
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          # The frozen-archive gate reads history, not just the tip.
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run static gates
        env:
          # The archived-notes gate compares the frozen archive against the
          # previous tip. A manual run has no previous tip, so fall back to HEAD.
          DSH_ARCHIVE_BASE_REF: ${{ github.event.before || 'HEAD' }}
        run: pnpm run check:ci:static

  tests:
    name: unit tests with coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      # A standard hosted runner has 4 vCPUs and 16 GB. The suite forks per
      # suite and instruments every file, so cap the workers instead of letting
      # vitest scale to the CPU count and exhaust memory.
      DSH_COVERAGE_MAX_WORKERS: '2'
      # Upstream's own hosted-runner finding, quoted from ci.yml: managed-scope
      # teardown cases run past the default 5000 ms per-test budget once a
      # lane's workers and sibling gates share one host, and the lane is green
      # at 90000. This lane hit the same wall without it —
      # scripts/persistence-schema.spec.ts timed out at 5000 ms while every
      # other file in the run passed.
      DSH_COVERAGE_TEST_TIMEOUT_MS: '90000'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      # Sandboxing specs shell out to bubblewrap; the script pins and verifies
      # the signed payload rather than running apt's full transaction.
      - name: Install dependencies and prepare bubblewrap
        run: |
          pnpm install --frozen-lockfile &
          install_pid=$!
          bash scripts/prepare-ci-bubblewrap.sh &
          sandbox_pid=$!
          install_status=0
          wait "$install_pid" || install_status=$?
          sandbox_status=0
          wait "$sandbox_pid" || sandbox_status=$?
          if (( install_status != 0 )); then exit "$install_status"; fi
          exit "$sandbox_status"
      - name: Run the unit suite under the coverage thresholds
        run: pnpm run check:ci:coverage

  snapshot:
    name: snapshot gates
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      # The snapshots replay real tool calls through the sandbox, which refuses
      # to run a command unconfined when no backend is usable — the recorded
      # output then carries a sandbox-unavailable error in place of the
      # command's own. Without bubblewrap every bash-backed snapshot mismatches.
      - name: Install dependencies and prepare bubblewrap
        run: |
          pnpm install --frozen-lockfile &
          install_pid=$!
          bash scripts/prepare-ci-bubblewrap.sh &
          sandbox_pid=$!
          install_status=0
          wait "$install_pid" || install_status=$?
          sandbox_status=0
          wait "$sandbox_pid" || sandbox_status=$?
          if (( install_status != 0 )); then exit "$install_status"; fi
          exit "$sandbox_status"
      # The Web snapshot executes the built client in a real browser. Only
      # Chromium is needed here: the WebKit cases live in the `.e2e.ts` lane,
      # which this gate does not include.
      - name: Install Playwright Chromium and its hosted dependencies
        run: pnpm --filter @deepseek-ai/dsh-web-frontend exec playwright install --with-deps chromium
      - run: pnpm run check:ci:snapshot

  artifacts:
    name: build, artifact, typecheck and lint gates
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      # The built-bin smoke runs a real CLI turn through the bash tool, so it
      # needs a usable sandbox backend for the same reason the snapshots do.
      - name: Install dependencies and prepare bubblewrap
        run: |
          pnpm install --frozen-lockfile &
          install_pid=$!
          bash scripts/prepare-ci-bubblewrap.sh &
          sandbox_pid=$!
          install_status=0
          wait "$install_pid" || install_status=$?
          sandbox_status=0
          wait "$sandbox_pid" || sandbox_status=$?
          if (( install_status != 0 )); then exit "$install_status"; fi
          exit "$sandbox_status"
      # This gate builds; the two after it read that build's outputs, which is
      # why they share the job rather than paying for a second build.
      - run: pnpm run check:ci:artifacts
      - run: pnpm run lint:contracts-ready
      - run: pnpm run typecheck:contracts-ready
