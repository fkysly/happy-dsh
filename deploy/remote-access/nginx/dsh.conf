# happy-dsh — nginx reverse proxy in front of the Web UI.
#
# Place in /etc/nginx/conf.d/ (or sites-available + a symlink), adjust
# server_name and the certificate paths, then `nginx -t && nginx -s reload`.
#
# Start the backend:
#
#     dsh web --no-open --trusted-host dsh.example.com
#
# ── The one line that matters ────────────────────────────────────────────────
#     proxy_set_header Host $host;
#
# nginx defaults to sending the upstream's own Host (127.0.0.1:3080), which
# fails the /api Host fence with 403 on every request. Caddy and Traefik
# preserve Host by default; nginx needs this line explicitly. This is the single
# most common cause of "the page loads but nothing works".

upstream dsh_backend {
	server 127.0.0.1:3080;
	keepalive 16;
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name dsh.example.com;

	# Provided by certbot, acme.sh, lego, or your own PKI. For a private
	# deployment use a DNS-01 challenge so no inbound port 80 is required.
	ssl_certificate     /etc/letsencrypt/live/dsh.example.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/dsh.example.com/privkey.pem;
	ssl_protocols TLSv1.2 TLSv1.3;
	add_header Strict-Transport-Security "max-age=31536000" always;

	# Generous: agent turns can be long, and the UI holds a socket open.
	proxy_read_timeout 3600s;
	proxy_send_timeout 3600s;

	location / {
		proxy_pass http://dsh_backend;

		# ── Load-bearing: keep the browser's authority ────────────────────
		# Both the /api Host fence and the browser-session cookie's authority
		# binding read this header. Rewrite it and every request is refused.
		proxy_set_header Host $host;

		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		# ── WebSocket for /api/remote.mux ─────────────────────────────────
		# Without these the socket never upgrades: the GUI loads, then
		# reconnects forever.
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
	}

	# ── Do NOT do these ───────────────────────────────────────────────────
	# proxy_set_header Host 127.0.0.1:3080;   ← 403 on everything
	# proxy_set_header Origin "";             ← the fence compares Origin to
	#                                           Host; stripping or rewriting
	#                                           either one breaks requests
	#
	# `X-Forwarded-*` is currently IGNORED by DSH. Setting it is harmless but
	# has no effect; see the README's "Forwarded headers" section.
}

# `$connection_upgrade` must be defined in the http{} block — put this in
# /etc/nginx/conf.d/upgrade-map.conf or your main nginx.conf:
#
# map $http_upgrade $connection_upgrade {
# 	default upgrade;
# 	''      close;
# }
