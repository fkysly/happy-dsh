# happy-dsh — Recipe A: serve behind a TLS reverse proxy on the same host.
#
# This is the file form of the recommended command-line invocation:
#
#     dsh web --no-open --trusted-host dsh.example.com
#
# Use the flag when one authority is enough. Use this overlay when you want the
# authority list to live in version control — or when you want both, which the
# expressions below support.
#
# Apply with:
#     dsh web --patch /absolute/path/to/behind-proxy.yml --no-open
#
# The proxy MUST forward the browser's original Host header, because both the
# /api Host fence and the browser-session cookie's authority binding read it:
#
#     nginx      proxy_set_header Host $host;
#     Caddy      (default — reverse_proxy preserves Host)
#     Traefik    (default)
#
# A patch replaces the targeted row's COMPLETE config, so every row below
# restates every key that row owns. Dropping a key silently resets it to the
# schema default.
#
# ── ⚠️  Do NOT write a bare literal authority list here ──────────────────────
#     trustedHosts: ['dsh.example.com']          ← WRONG
#
# That replaces the composed expression and silently discards every
# `--trusted-host` value, so a deployment that passes both the flag and this
# file ends up refusing the flag's authority with 403. Keep the expression and
# concatenate, as below. The upstream bundle header states the same rule.

# The webserver row is deliberately NOT touched: with a same-host proxy the
# backend stays bound to 127.0.0.1 and only the proxy can reach it.
#
# The `--host` flag stays meaningful for this overlay, because
# `webStartup.host` still feeds the untouched `webserver` row.

- id: web-runtime
  name: '@deepseek-ai/dsh-web-app'
  config:
    openBrowser: !!js ctx.webStartup.openBrowser
    printUrl: true
    surfaceContext: true
    # Authorities named on the command line, plus the ones listed here.
    #
    # ⚠️  `!!js` takes a SCALAR — a quoted string holding the expression. A YAML
    # flow sequence (`!!js [a, b]`) makes the tag apply to a sequence node and
    # the overlay fails to parse with "unknown tag !<tag:yaml.org,2002:js>".
    trustedHosts: !!js "[...ctx.webStartup.trustedHosts, 'dsh.example.com']"

- id: connection
  name: '@deepseek-ai/dsh-client-connection'
  config:
    # Unchanged from the bundle: it already reads the composed web-runtime
    # value, so it picks up both sources above. Restated because a patch
    # replaces the whole config — see the note on restating keys.
    trustedHosts: !!js ctx.webRuntime.trustedHosts
